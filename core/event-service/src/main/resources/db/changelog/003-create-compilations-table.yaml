databaseChangeLog:
  - changeSet:
      id: 003-create-compilations-table
      author: artem

      changes:
        - createTable:
            schemaName: event
            tableName: compilations

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_compilations
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: pinned
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false