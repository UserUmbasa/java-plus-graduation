databaseChangeLog:
  - changeSet:
      id: 002-create-events-table
      author: artem

      changes:
        - createTable:
            schemaName: event
            tableName: events

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_events
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(120)
                  constraints:
                    nullable: false

              - column:
                  name: annotation
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: initiator_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: event_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

              - column:
                  name: published_on
                  type: TIMESTAMP

              - column:
                  name: location_lat
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false

              - column:
                  name: location_lon
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false

              - column:
                  name: paid
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: participant_limit
                  type: INT
                  defaultValueNumeric: 0

              - column:
                  name: request_moderation
                  type: BOOLEAN
                  defaultValueBoolean: true

              - column:
                  name: state
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: event
            baseTableName: events
            baseColumnNames: category_id

            referencedTableSchemaName: event
            referencedTableName: categories
            referencedColumnNames: id

            constraintName: fk_category

        - sql:
            sql: |
              ALTER TABLE event.events
              ADD CONSTRAINT chk_state
              CHECK (state IN ('PENDING', 'PUBLISHED', 'CANCELED'));