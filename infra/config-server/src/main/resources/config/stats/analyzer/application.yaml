grpc:
  server:
    port: 0

spring:
  application:
    name: analyzer

  output:
    ansi:
      enabled: always

  sql:
    init:
      mode: never # Не использовать schema.sql/data.sql

  liquibase:
    enabled: true # Включить Liquibase
    change-log: classpath:db/changelog/db.changelog-master.yaml

  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${STATS_DB_HOST:localhost}:${STATS_DB_PORT:6432}/${STATS_DB_NAME:analyzer}
    username: ${STATS_DB_USER:test}
    password: ${STATS_DB_PASSWORD:test}

  jpa:
    hibernate:
      ddl-auto: validate # Только проверять соответствие Entity и БД

    database-platform: org.hibernate.dialect.PostgreSQLDialect

    properties:
      hibernate:
        default_schema: analyzer # Hibernate работает со схемой analyzer
        format_sql: true          # Красивый вывод SQL

    show-sql: true # Показывать SQL в логах

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

analyzer:
  kafka:
    consumer:
      user-action:
        properties:
          client.id: analyzerUserActionConsumer
          group.id: analyzer-user-action
          bootstrap.servers: localhost:9092
          key.deserializer: org.apache.kafka.common.serialization.LongDeserializer
          value.deserializer: ru.practicum.avroschema.deserializer.UserActionAvroDeserializer
          enable.auto.commit: false

      event-similarity:
        properties:
          client.id: analyzerEventSimilarityConsumer
          group.id: analyzer-event-similarity
          bootstrap.servers: localhost:9092
          key.deserializer: org.apache.kafka.common.serialization.LongDeserializer
          value.deserializer: ru.practicum.avroschema.deserializer.EventSimilarityAvroDeserializer
          enable.auto.commit: false

    topics:
      user-actions: stats.user-actions.v1
      events-similarity: stats.events-similarity.v1

application:
  action-weight:
    view: 0.4
    register: 0.8
    like: 1.0