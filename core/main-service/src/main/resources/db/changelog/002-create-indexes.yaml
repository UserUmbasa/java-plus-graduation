databaseChangeLog:
  - changeSet:
      id: 002-create-indexes
      author: artem

      changes:
        - createIndex:
            schemaName: main
            tableName: comments
            indexName: idx_comments_event_id
            columns:
              - column:
                  name: event_id

        - createIndex:
            schemaName: main
            tableName: comments
            indexName: idx_comments_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            schemaName: main
            tableName: comments
            indexName: idx_comments_status
            columns:
              - column:
                  name: status

        - createIndex:
            schemaName: main
            tableName: comments
            indexName: idx_comments_created_at
            columns:
              - column:
                  name: created_at

        - createIndex:
            schemaName: main
            tableName: comments
            indexName: idx_comments_updated_at
            columns:
              - column:
                  name: updated_at