databaseChangeLog:
  - changeSet:
      id: 002-create-indexes
      author: artem

      changes:
        - createIndex:
            schemaName: request
            tableName: participation_requests
            indexName: idx_requests_requester_id
            columns:
              - column:
                  name: requester_id

        - createIndex:
            schemaName: request
            tableName: participation_requests
            indexName: idx_requests_event_id
            columns:
              - column:
                  name: event_id

        - createIndex:
            schemaName: request
            tableName: participation_requests
            indexName: idx_requests_status
            columns:
              - column:
                  name: status

        - createIndex:
            schemaName: request
            tableName: participation_requests
            indexName: idx_requests_created_at
            columns:
              - column:
                  name: created_at