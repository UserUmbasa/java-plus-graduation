spring:
  application:
    name: event-service
  sql:
    init:
      mode: always
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${EVENT_DB_HOST:localhost}:${EVENT_DB_PORT:6435}/${EVENT_DB_NAME:event-service}
    username: ${EVENT_DB_USER:test}
    password: ${EVENT_DB_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: create-drop #none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: event
        format_sql: true

    show-sql: true  # Добавляем здесь
    logging: # Добавляем секцию логирования
      level:
        org:
          hibernate:
            SQL: DEBUG
            type:
              descriptor:
                sql:
                  BasicBinder: TRACE

  # Настройки Eureka клиента
eureka:
  instance:
    # Использовать IP вместо имени хоста (решает проблему с DNS)
    prefer-ip-address: true
    # Явно задаем формат ID, чтобы там был IP, а не имя хоста
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${random.value}

server:
    port: 0
grpc:
  client:
      collector:
        address: "discovery:///collector"
        enableKeepAlive: true
        keepAliveWithoutCalls: true
        negotiationType: PLAINTEXT
