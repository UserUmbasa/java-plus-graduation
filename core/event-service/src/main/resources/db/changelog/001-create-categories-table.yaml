databaseChangeLog:
  - changeSet:
      id: 001-create-categories-table
      author: artem

      changes:
        - createTable:
            schemaName: event
            tableName: categories

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categories
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_categories_name

        - sql:
            sql: |
              ALTER TABLE event.categories
              ADD CONSTRAINT ck_categories_name
              CHECK (LENGTH(name) >= 1);