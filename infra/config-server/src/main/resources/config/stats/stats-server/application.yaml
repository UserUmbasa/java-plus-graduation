spring:
  application:
    name: stats-server
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://${STATS_DB_HOST:localhost}:${STATS_DB_PORT:6432}/${STATS_DB_NAME:stats}
    username: ${STATS_DB_USER:test}
    password: ${STATS_DB_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: create-drop #none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: stats
        format_sql: true

    show-sql: true  # Добавляем здесь
    logging: # Добавляем секцию логирования
      level:
        org:
          hibernate:
            SQL: DEBUG
            type:
              descriptor:
                sql:
                  BasicBinder: TRACE

  # Настройки Eureka клиента
eureka:
  instance:
    # Использовать IP вместо имени хоста (решает проблему с DNS)
    prefer-ip-address: true
    # Явно задаем формат ID, чтобы там был IP, а не имя хоста
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${random.value}

server:
  port: ${STATS_SERVER_PORT:9090} #0